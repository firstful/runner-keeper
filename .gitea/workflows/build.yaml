name: build-image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted]
    container:
      image: node:22-bookworm
      # DinD socket lives in the runner pod's shared emptyDir (/var/run).
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push image
        run: |
          set -e
          SHA8=$(echo "${GITHUB_SHA}" | cut -c1-8)
          apt-get update -qq
          apt-get install -y -qq docker.io >/dev/null
          echo "${{ secrets.REGISTRY_PUSH_TOKEN }}" | docker login 192.168.1.2:3000 -u reeds --password-stdin
          docker build -t 192.168.1.2:3000/reeds/runner-keeper:latest -t 192.168.1.2:3000/reeds/runner-keeper:${SHA8} .
          docker push 192.168.1.2:3000/reeds/runner-keeper:latest
          docker push 192.168.1.2:3000/reeds/runner-keeper:${SHA8}
          echo "pushed runner-keeper:${SHA8}"
